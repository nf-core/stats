name: Run All Pipelines
"on":
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight
  workflow_dispatch: # Allow manual triggers
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/run_pipelines.yml"
  push:
    branches:
      - main
    paths:
      - "pipeline/**"
      - ".github/workflows/run_pipelines.yml"

# Minimal default; the run_pipelines job alone raises id-token for AWS OIDC.
permissions:
  contents: read

env:
  SOURCES__GITHUB_PIPELINE__GITHUB__API_TOKEN: ${{ secrets.GH_TOKEN_STATS_PAGE }}
  SOURCES__SLACK_PIPELINE__SLACK__API_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
  # Do not include motherduck tokens in case of a PR event, to avoid accidentically pushing to the prod database
  DESTINATION__MOTHERDUCK__CREDENTIALS__DATABASE: ${{ github.event_name != 'pull_request' && 'nf_core_stats_bot' || '' }}
  DESTINATION__MOTHERDUCK__CREDENTIALS__PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MOTHERDUCK_TOKEN || '' }}
  # For pull requests, use local DuckDB instead of MotherDuck
  DESTINATION__DUCKDB__CREDENTIALS: ${{ github.event_name == 'pull_request' && './nf_core_stats.duckdb' || '' }}
  PYTHONUNBUFFERED: "1"

jobs:
  maybe_skip:
    name: Skip if duplicate
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5
        with:
          # `always` skips a run whenever ANY other run is in flight, which made a
          # lone PR run get skipped when it raced a push run — the pipeline job never
          # executed and the PR reported a vacuous green. Only skip runs that a newer
          # commit on the same branch has superseded.
          concurrent_skipping: outdated_runs
          skip_after_successful_duplicate: false

  run_pipelines:
    name: Run ${{ matrix.pipeline }} pipeline
    needs: maybe_skip
    if: needs.maybe_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    # Single source of truth for "is this a real run?". PR runs (e.g. from forks
    # without secrets) are expected to fail auth and must not go through runitor:
    # that pings the production healthchecks.io monitor with the real UUID, turning
    # an expected PR failure into a false "pipeline is down" alert.
    env:
      USE_RUNITOR: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pipeline: github
          - pipeline: slack
          - pipeline: citations
          - pipeline: newsletter
    permissions:
      contents: read
      id-token: write # AWS OIDC (newsletter pipeline only)
    defaults:
      run:
        working-directory: pipeline
    steps:
      # Production runitor UUIDs live in repository secrets (not the workflow file) so
      # public readers cannot forge pings. Validate format here so a typo in a secret
      # fails loudly instead of silently no-op'ing at ping time.
      - name: Resolve healthcheck UUID
        if: env.USE_RUNITOR == 'true'
        id: healthcheck
        env:
          PIPELINE: ${{ matrix.pipeline }}
          HEALTHCHECK_UUID_GITHUB: ${{ secrets.HEALTHCHECK_UUID_GITHUB }}
          HEALTHCHECK_UUID_SLACK: ${{ secrets.HEALTHCHECK_UUID_SLACK }}
          HEALTHCHECK_UUID_CITATIONS: ${{ secrets.HEALTHCHECK_UUID_CITATIONS }}
          HEALTHCHECK_UUID_NEWSLETTER: ${{ secrets.HEALTHCHECK_UUID_NEWSLETTER }}
        run: |
          case "$PIPELINE" in
            github) UUID="$HEALTHCHECK_UUID_GITHUB" ;;
            slack) UUID="$HEALTHCHECK_UUID_SLACK" ;;
            citations) UUID="$HEALTHCHECK_UUID_CITATIONS" ;;
            newsletter) UUID="$HEALTHCHECK_UUID_NEWSLETTER" ;;
            *)
              echo "::error::Unknown pipeline: $PIPELINE"
              exit 1
              ;;
          esac
          if [ -z "$UUID" ]; then
            echo "::error::Missing HEALTHCHECK_UUID_${PIPELINE^^} repository secret for production runitor monitoring."
            exit 1
          fi
          if ! [[ "$UUID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Malformed healthchecks.io UUID for '$PIPELINE': '$UUID' is not valid 8-4-4-4-12 hex format. Recover the correct value from the healthchecks.io dashboard rather than guessing."
            exit 1
          fi
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.10"
          # The newsletter leg's run step is skipped on PRs, so uv never installs
          # anything and no cache dir is created — enabling the cache would then
          # make setup-uv's post step fail on the missing dir. Disable it there.
          enable-cache: ${{ !(matrix.pipeline == 'newsletter' && github.event_name == 'pull_request') }}
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install runitor
        if: env.USE_RUNITOR == 'true'
        env:
          RUNITOR_VERSION: "v1.3.0-build.4"
        run: |
          # Download binary and SHA256 file
          curl -fsSL -o runitor \
            "https://github.com/bdd/runitor/releases/download/${RUNITOR_VERSION}/runitor-${RUNITOR_VERSION}-linux-amd64"
          # Make executable and test
          chmod +x runitor
          ./runitor -version
          sudo mv runitor /usr/local/bin/

      # The newsletter pipeline reads the contact list via the AWS SES API.
      - name: Configure AWS credentials
        if: matrix.pipeline == 'newsletter' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Get ${{ matrix.pipeline }} stats
        # newsletter has no credentials on PRs (OIDC isn't available to forks), so skip it there.
        if: ${{ !(matrix.pipeline == 'newsletter' && github.event_name == 'pull_request') }}
        env:
          PIPELINE: ${{ matrix.pipeline }}
          UUID: ${{ steps.healthcheck.outputs.uuid }}
        run: |
          if [ "$USE_RUNITOR" = "true" ]; then
            runitor -uuid "$UUID" -- \
                uv run nf_core_stats "$PIPELINE"
          else
            uv run nf_core_stats "$PIPELINE" --destination duckdb
          fi

      - name: Upload DuckDB artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duckdb-${{ matrix.pipeline }}
          path: pipeline/nf_core_stats.duckdb
          retention-days: 7
