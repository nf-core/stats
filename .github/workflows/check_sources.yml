name: Check Sources

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "sources/**"
      # Evidence version bumps can break the source build.
      - "package.json"
      - ".github/workflows/check_sources.yml"

permissions:
  contents: read

jobs:
  check_sources:
    name: Build sources
    runs-on: ubuntu-latest
    # Forks cannot read secrets, so the build would fail for reasons unrelated
    # to the change.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - run: npm ci

      # Plain `evidence sources` exits 0 even when a query fails; --strict does not.
      - env:
          EVIDENCE_SOURCE__nfcore_db__token: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: npx evidence sources --strict
