name: Schedule Netlify Build
on:
  workflow_dispatch:
  schedule:
    # Pipelines moved to 03:17 UTC (run_pipelines.yml); rebuild after they finish
    # so the site embeds fresh MotherDuck data. See #159 / #163.
    - cron: "30 4 * * *" # Once a day, after scheduled pipeline run
permissions: {}

jobs:
  build:
    name: Request Netlify Webhook
    runs-on: ubuntu-latest
    steps:
      - run: curl -X POST -d {} ${{ secrets.NETLIFY_BUILD_HOOK }}
